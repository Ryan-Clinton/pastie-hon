name: Release

# Pushing a tag like v0.3.0 builds the Windows download and publishes a GitHub
# Release with it. The build is tested *as built*, not just as source: SPEC.md
# section 11 asks for the packaged artefact to be exercised, and a native
# library PyInstaller left behind only shows itself on somebody else's PC.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" -c constraints.txt

      - name: the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import pastie; print(pastie.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pastie ${version}"; exit 1; }
          # What PyPI will be told, not just what the code says (0.3.1 differed).
          packaged=$(python -c "from importlib.metadata import version; print(version('pastie-hon'))")
          test "$packaged" = "$version" || { echo "package metadata says ${packaged}, pastie says ${version}"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: version (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: bash
        run: echo "VERSION=$(python -c 'import pastie; print(pastie.__version__)')" >> "$GITHUB_ENV"

      - name: the checks CI runs
        run: |
          pytest -q
          python scripts/third_party_notices.py --check

      - name: build
        run: pyinstaller packaging/pastie.spec --noconfirm --distpath build/pkg/dist --workpath build/pkg/work

      - name: the build carries what the service needs
        run: |
          build\pkg\dist\Pastie\pastie-cli.exe --self-check
          build\pkg\dist\Pastie\pastie-cli.exe --version
          build\pkg\dist\Pastie\pastie-cli.exe demo all
        shell: cmd

      - name: zip
        shell: pwsh
        run: |
          Copy-Item THIRD_PARTY_NOTICES.txt, LICENSE build\pkg\dist\Pastie\
          Compress-Archive build\pkg\dist\Pastie "build\pkg\Pastie-$env:VERSION-Windows-x64.zip"

      - name: installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc "/DVersion=$env:VERSION" packaging\pastie.iss
          Move-Item "build\pkg\installer\PastieSetup-$env:VERSION.exe" build\pkg\

      - name: checksums
        shell: pwsh
        run: |
          Get-ChildItem build\pkg\*.zip, build\pkg\*.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii build\pkg\SHA256SUMS.txt
          Get-Content build\pkg\SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pastie-windows
          path: |
            build/pkg/*.zip
            build/pkg/*.exe
            build/pkg/SHA256SUMS.txt

      - name: release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python scripts/release_notes.py "$VERSION" > build/pkg/NOTES.md

      - name: publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Pastie $VERSION" \
            --notes-file build/pkg/NOTES.md \
            build/pkg/*.zip build/pkg/*.exe build/pkg/SHA256SUMS.txt

  # `pip install pastie-hon`, for people who would rather have Python than an
  # installer. Published only after the Windows build has passed, so a version
  # on PyPI always has a tested download beside it.
  #
  # Trusted publishing: no token is stored anywhere. PyPI trusts this workflow
  # in this repository, in the `pypi` environment - set up once on pypi.org
  # (docs/HANDOVER.md, "Releasing").
  pypi:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build the sdist and wheel
        run: pipx run build
      - name: the package is what PyPI will accept
        run: pipx run twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
