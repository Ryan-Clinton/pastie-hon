<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!--
  No network, ever (docs/UI-SPEC.md 5.3, A8). connect-src 'none' means the page
  cannot fetch anything even if a later change tries to. Everything it needs is
  in this folder; it talks to Python only through window.pywebview.api.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; img-src 'self' file: data:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pastie</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <img class="bar-icon" src="brand/icon.svg" alt="">
  <span class="bar-name">Pastie</span>
  <span class="health" id="health" role="status"><span class="dot"></span><span class="words">Connecting…</span></span>
</header>

<div class="shell">
  <nav class="rail" aria-label="Sections">
    <button class="rail-btn active" data-view="home" aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <button class="rail-btn" data-view="history" aria-label="History" title="History"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1-8.5 6h2.2A7 7 0 1 0 12 5v3L7.5 4.5 12 1zM11 8h2v5l4 2.4-1 1.7L11 14z"/></svg></button>
    <button class="rail-btn" data-view="guide" aria-label="Guide" title="Guide"><svg viewBox="0 0 24 24"><path d="M5 3h9a4 4 0 0 1 4 4v14l-1-1a4 4 0 0 0-3-1H5zm2 3v2h7V6zm0 4v2h7v-2z"/></svg><span class="new-dot" id="guide-dot" hidden></span></button>
    <button class="rail-btn" data-view="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><path d="m12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm8.4 4.9-1.8 1.1.2 2.1-2 2-2.1-.2-1.1 1.8h-2.8l-1.1-1.8-2.1.2-2-2 .2-2.1-1.8-1.1v-2.8l1.8-1.1-.2-2.1 2-2 2.1.2 1.1-1.8h2.8l1.1 1.8 2.1-.2 2 2-.2 2.1 1.8 1.1z"/></svg></button>
    <button class="rail-btn" data-view="about" aria-label="About" title="About"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-1 8v7h2v-7zm0-4v2h2V6z"/></svg></button>
  </nav>

  <main class="views">
    <section class="view" id="view-home" aria-label="Home">
      <div class="caseload-heading" id="caseload-heading" hidden></div>
      <div class="caseload" id="caseload" role="tablist" aria-label="Appliances"></div>
      <div id="home"></div>
    </section>
    <section class="view" id="view-history" hidden aria-label="History"></section>
    <section class="view" id="view-guide" hidden aria-label="Guide"></section>
    <section class="view" id="view-settings" hidden aria-label="Settings"></section>
    <section class="view" id="view-about" hidden aria-label="About"></section>
    <section class="view" id="view-diagnostics" hidden aria-label="Diagnostics"></section>
  </main>
</div>

<div class="why-backdrop" id="why" hidden>
  <div class="why document" role="dialog" aria-modal="true" aria-labelledby="why-title">
    <div class="why-head"><span>WHY DOES PASTIE SAY THIS?</span><span id="why-title"></span></div>
    <div id="why-body"></div>
    <dl class="why-meta"><dt>Source</dt><dd id="why-source"></dd><dt>Confidence</dt><dd id="why-confidence"></dd></dl>
    <button class="btn secondary" id="why-close">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
